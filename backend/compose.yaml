services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gala
      POSTGRES_USER: gala
      POSTGRES_PASSWORD: gala_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - gala-postgres:/var/lib/postgresql/data
      - ./test/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gala -d gala"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgres://gala:gala_dev_only@db:5432/gala
    command: ["pnpm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgres://gala:gala_dev_only@db:5432/gala
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  gala-postgres:
